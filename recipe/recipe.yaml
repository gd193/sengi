package:
  name: sengi
  version: 0.2.0
source:
  path: ..
build:
  number: 0
  noarch: python
  script:
    - python -m build --wheel --no-isolation
    - python -m installer dist/*.whl
requirements:
  host:
    - python 3.11.*
    - python-build
    - hatchling
    - python-installer
  run:
    - python >=3.11
    - jax
    - numpy
  run_constraints:
    - warp-lang ==1.18.0
tests:
  - script:
      - python -c "from sengi.bvh import IndexSpec"
      - python -c "from importlib.resources import files; root = files('sengi'); assert all((root / path).is_file() for path in ('bvh/traversal/native/traversal.h', 'primitives/native/triangle_distance.h', 'metrics/native/box_distance.h', 'queries/native/robin.h', 'queries/native/knn_candidates.h'))"
