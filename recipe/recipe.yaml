package:
  name: sengi
  version: 0.4.0
source:
  path: ..
build:
  number: 0
  noarch: python
  script:
    - python -m build --wheel --no-isolation
    - python -m installer dist/*.whl
    - |
      python - <<'PYTHON'
      from importlib.resources import files
      from pathlib import Path

      source = Path("src/sengi")
      installed = files("sengi")
      for path in source.rglob("*"):
          if path.suffix in {".h", ".pyi"} or path.name == "py.typed":
              target = installed / path.relative_to(source)
              assert target.read_bytes() == path.read_bytes(), target
      PYTHON
requirements:
  host:
    - python 3.11.*
    - python-build
    - hatchling
    - python-installer
  run:
    - python >=3.11
    - jax
    - numpy
  run_constraints:
    - warp-lang ==1.18.0
tests:
  - script:
      - python -c "from sengi.bvh import IndexSpec"
