[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sengi"
version = "0.3.1"
description = "Spatial tree builders and primitive-generic geometry queries for JAX and Warp"
requires-python = ">=3.11"
dependencies = ["jax", "numpy"]

[project.optional-dependencies]
warp = ["warp-lang==1.18.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/sengi"]
